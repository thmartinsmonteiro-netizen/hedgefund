      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q pandoc wkhtmltopdf
      - run: pip install -r requirements.txt
      - run: python scripts/nav.py && python scripts/build_xlsx.py && python scripts/render_memo.py
      - name: Commit reports and first PDF
        run: |
          git config user.name "paper-fund-bot"; git config user.email "bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "reports after patch A1 (incl. memo W37 PDF)"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with: { name: memo-pdf, path: reports/memos/*.pdf }
