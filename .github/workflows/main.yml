name: daily-mark
on:
  schedule:
    # 21:30 UTC = 18:30 Sao Paulo, after B3 (17:00 BRT) and well after Athens/London closes. Weekdays only.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Mark prices (exit 2 = marked with gaps, still commits)
        id: mark
        run: |
          set +e
          python scripts/mark.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
      - run: python scripts/nav.py
      - run: python scripts/build_xlsx.py
      - name: Commit
        run: |
          git config user.name "paper-fund-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.csv reports/
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "mark $(date -u +%F) (gaps=${{ steps.mark.outputs.code }})"
          git push
      - name: Warn on gaps
        if: steps.mark.outputs.code == '2'
        run: echo "::warning::Some symbols had no close today; see reports/summary.md flags"
