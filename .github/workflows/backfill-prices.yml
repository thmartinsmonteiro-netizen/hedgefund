name: backfill-prices
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: fund-writes, cancel-in-progress: false }
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Backfill missing closes since fund start
        run: python scripts/mark.py --backfill || [ $? -eq 3 ]
      - run: python scripts/nav.py
      - run: python scripts/build_xlsx.py
      - name: Commit
        run: |
          git config user.name "paper-fund-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/prices.csv reports/
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "backfill prices since fund start and recompute NAV (CHANGELOG 2026-10-21)"
          git pull --rebase
          git push
