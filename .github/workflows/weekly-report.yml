name: weekly-report
on:
  push:
    branches: [main]
    paths: ["memos/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q pandoc wkhtmltopdf
      - run: pip install -r requirements.txt
      - run: python scripts/nav.py
      - run: python scripts/render_memo.py
      - name: Commit PDF
        run: |
          git config user.name "paper-fund-bot"; git config user.email "bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "render memo PDF"
          git push
      - uses: actions/upload-artifact@v4
        with: { name: memo-pdf, path: reports/memos/*.pdf }
